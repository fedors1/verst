<!DOCTYPE html>

<head>

    <title>Контакты</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="my_selectors/selectors.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body>

    <div class="sidebar">

                <i class="bi bi-bootstrap me-2"></i>

            </div>
            <div class="d-grid gap-1 px-3">
                <a href="main.html" class="btn btn-dark" style="width: 100%; text-align: left; color: white;">
                    <i class="bi bi-house"></i>
                    Главная
                </a>
                <a href="categories.html" class="btn btn-dark" style="width: 100%; text-align: left; color: white;">
                    <i class="bi bi-speedometer2"></i>
                    Категории
                </a>
                <a href="orders.html" class="btn btn-dark" style="width: 100%; text-align: left; color: white;">
                    <i class="bi bi-table"></i>
                    Заказы
                </a>
                <a href="contacts.html" class="btn btn-dark" style="width: 100%; text-align: left; color: white;">
                    <i class="bi bi-person-circle"></i>
                    Контакты
                </a>
            </div>
        </div>

        <div class="user-section">
            <div class="user-avatar"></div>
                <div class="btn-group dropup">
                    <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" style="background: none; border: none; color: white;">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" style="background: none; border: none; color: black;">Профиль</a></li>

        <div class="header-one">
            <h1>Контакты</h1>
        </div>

        <div class="main-content-area">

            <div class="card" style="width: 25rem; margin: 35px; margin-left: 395px;">
                <div class="mb-3" style="margin: 10px;">
                    <label class="form-label">Имя</label>
                    <input type="email" class="form-control">
                </div>
                <div class="mb-3" style="margin: 10px;">
                    <label class="form-label">Почта</label>
                    <div class="input-group flex-nowrap">
                        <span class="input-group-text" style="color: black;">@</span>
                        <input type="text" class="form-control">
                    </div>
                </div>
                <div class="mb-3" style="margin: 10px;">
                    <label class="form-label">Сообщение</label>
                    <textarea class="form-control" rows="2"></textarea>
                    <button type="button" class="btn btn-outline-primary" style="margin-top: 10px;">Отправить</button>
                </div>
            </div>

        <div class="contact-info">
            <h4 style="margin-left: 35px">Наши контакты</h4>

            <p style="text-align: left; padding-left: 0; margin-left: 35px; color: black;">
                По всем вопросам и предложениям<br />
                вы можете обратиться на почту ryan337@mail.ru.<br />
                Проект находится в стадии разработки,<br />
                поэтому все ваши пожелания могут быть учтены<br />
                в следющих версиях. Спасибо! :)

            </p>
        </div>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js">
